apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicave-console
  namespace: aicave-prod
  labels:
    app: aicave-console
spec:
  replicas: 5
  selector:
    matchLabels:
      app: aicave-console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aicave-console
    spec:
      containers:
      - name: aicave-console
        image: docker.io/library/ai-media-fe:v1.0.25
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: NEXTAUTH_SECRET
          value: "n5yaP7ynm0Qf/JhIJVLXmfQH0zr+YgKwk0TdWo9EFwo="
        - name: VERSION
          value: "2.0.0"
        - name: AUTH_BACKEND_URL
          value: "http://aicave-user-service:8972/api"
        - name: NEXT_PUBLIC_API_BASE_URL_USER
          value: "https://www.aicave.ai/public/api/v1/user/api"
        - name: NEXT_PUBLIC_API_BASE_URL_REPORT
          value: "https://www.aicave.ai/public/api/v1/report"
        - name: NEXT_PUBLIC_API_BASE_URL_CORE
          value: "https://www.aicave.ai/public/api/v1/core"
        - name: NEXT_PUBLIC_API_BASE_URL_WORKER
          value: "https://www.aicave.ai/public/api/v1/worker"
        - name: NEXT_PUBLIC_API_BASE_URL_WEB_HOOCK
          value: "https://www.aicave.ai/public/api/v1/web-hook"
        - name: NEXTAUTH_URL
          value: "https://www.aicave.ai"
        - name: KEYCLOAK_CLIENT_ID
          value: "eportal-client-id"
        - name: KEYCLOAK_CLIENT_SECRET
          value: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
        - name: KEYCLOAK_ISSUER
          value: "https://id24.aicave.ai/realms/eportal"
        - name: AUTH_TRUST_HOST
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5