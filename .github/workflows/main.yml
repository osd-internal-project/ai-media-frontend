name: CI Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.pkg.outputs.name }}
      image_version: ${{ steps.pkg.outputs.ver }}

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Read package info
      # ---------------------------------------------------------------------
      - name: Read Package Info
        id: pkg
        run: |
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "ver=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "📦 Package: $(jq -r .name package.json)"
          echo "📦 Version: $(jq -r .version package.json)"
          echo "🌍 Deploy Env: ${{ secrets.DEPLOY_ENV }}"

      # ---------------------------------------------------------------------
      # Build Docker image
      # ---------------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} -f ./Dockerfile .

      # ---------------------------------------------------------------------
      # Login to Huawei Cloud Container Registry
      # ---------------------------------------------------------------------
      - name: Login to Huawei Cloud SWR
        run: |
          docker login -u ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            -p ${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            swr.ap-southeast-2.myhuaweicloud.com

      # ---------------------------------------------------------------------
      # Tag and Push Docker image to Registry
      # ---------------------------------------------------------------------
      - name: Tag and Push Docker Image
        run: |
          docker tag ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} \
            swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }}
          docker push swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }}      
      
      # ---------------------------------------------------------------------
      # Cleanup local Docker images
      # ---------------------------------------------------------------------
      - name: Cleanup Docker Images
        if: always()
        run: |
          docker rmi ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} || true
          docker rmi swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} || true
          docker image prune -f
          docker builder prune -f

  deploy:
    runs-on: [self-hosted, k8s]
    needs: build-and-push

    steps:
      # ---------------------------------------------------------------------
      # Checkout (needed for helm charts)
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Create / refresh image pull secret in the target namespace
      # ---------------------------------------------------------------------
      - name: Create Image Pull Secret
        run: |
          kubectl create secret docker-registry huawei-swr-secret \
            --docker-server=swr.ap-southeast-2.myhuaweicloud.com \
            --docker-username=ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            --docker-password=${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            --namespace=aicave-${{ secrets.DEPLOY_ENV }} \
            --dry-run=client -o yaml | kubectl apply -f -

