name: CI Workflow

concurrency:
  group: deploy-aicare-console
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.pkg.outputs.name }}
      image_version: ${{ steps.pkg.outputs.ver }}

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Read package info
      # ---------------------------------------------------------------------
      - name: Read Package Info
        id: pkg
        run: |
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "ver=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "📦 Package: $(jq -r .name package.json)"
          echo "📦 Version: $(jq -r .version package.json)"
          echo "🌍 Deploy Env: ${{ secrets.DEPLOY_ENV }}"

      # ---------------------------------------------------------------------
      # Build Docker image
      # ---------------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build --no-cache --platform linux/amd64 \
            -t ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} -f ./Dockerfile .

      # ---------------------------------------------------------------------
      # Login to Huawei Cloud Container Registry
      # ---------------------------------------------------------------------
      - name: Login to Huawei Cloud SWR
        run: |
          docker login -u ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            -p ${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            swr.ap-southeast-2.myhuaweicloud.com

      # ---------------------------------------------------------------------
      # Tag and Push Docker image to Registry
      # ---------------------------------------------------------------------
      - name: Tag and Push Docker Image
        run: |
          docker tag ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} \
            swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }}
          docker push swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }}      
      
      # ---------------------------------------------------------------------
      # Cleanup local Docker images
      # ---------------------------------------------------------------------
      - name: Cleanup Docker Images
        if: always()
        run: |
          docker rmi ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} || true
          docker rmi swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} || true
          docker image prune -f
          docker builder prune -f

  deploy:
    runs-on: [self-hosted, k8s]
    needs: build-and-deploy

    steps:
      # ---------------------------------------------------------------------
      # Checkout (needed for helm charts)
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Create / refresh image pull secret in the target namespace
      # ---------------------------------------------------------------------
      - name: Create Image Pull Secret
        run: |
          kubectl create secret docker-registry huawei-swr-secret \
            --docker-server=swr.ap-southeast-2.myhuaweicloud.com \
            --docker-username=ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            --docker-password=${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            --namespace=aicave-${{ secrets.DEPLOY_ENV }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ---------------------------------------------------------------------
      # Fix stuck Helm release (pending-install / pending-upgrade / pending-rollback)
      # ---------------------------------------------------------------------
      - name: Fix Stuck Helm Release
        run: |
          DEPLOY_ENV="${{ secrets.DEPLOY_ENV }}"
          NS="aicave-${DEPLOY_ENV}"
          RELEASE="aicave-console"
          STATUS=$(helm status ${RELEASE} -n ${NS} -o json 2>/dev/null | jq -r '.info.status' 2>/dev/null || echo "not-found")
          echo "Current Helm release status: ${STATUS}"
          if [ "$STATUS" = "pending-install" ] || [ "$STATUS" = "pending-upgrade" ] || [ "$STATUS" = "pending-rollback" ]; then
            echo "Release ${RELEASE} is stuck (${STATUS}), rolling back..."
            helm rollback ${RELEASE} 0 -n ${NS} || helm uninstall ${RELEASE} -n ${NS} || true
          fi

      # ---------------------------------------------------------------------
      # Helm upgrade (runs on self-hosted runner with cluster access)
      # ---------------------------------------------------------------------
      - name: Helm Upgrade
        run: |
          set -e
          DEPLOY_ENV="${{ secrets.DEPLOY_ENV }}"
          NAME="${{ needs.build-and-deploy.outputs.image_name }}"
          VER="${{ needs.build-and-deploy.outputs.image_version }}"

          echo "🚀 Helm upgrade aicave-console (env: ${DEPLOY_ENV})"
          echo "📦 Image: swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${NAME}:${VER}"

          helm upgrade --install aicave-console ./charts/aicave-console-chart \
            -f ./charts/aicave-console-chart/values-${DEPLOY_ENV}.yaml \
            --set image.repository=swr.ap-southeast-2.myhuaweicloud.com/osd-internal/${NAME} \
            --set image.tag=${VER} \
            --namespace aicave-${DEPLOY_ENV} \
            --wait \
            --timeout 5m \
            --atomic \
            --history-max 10

          echo "✅ Deployment completed: ${NAME}:${VER} (env: ${DEPLOY_ENV})"

      # ---------------------------------------------------------------------
      # Debug on failure — capture pod state before atomic rollback completes
      # ---------------------------------------------------------------------
      - name: Debug on Failure
        if: failure()
        run: |
          NS="aicave-${{ secrets.DEPLOY_ENV }}"
          echo "====== POD STATUS ======"
          kubectl get pods -n ${NS} -l app=aicave-console -o wide

          echo "====== POD EVENTS ======"
          kubectl get events -n ${NS} --sort-by='.lastTimestamp' \
            --field-selector involvedObject.kind=Pod | tail -40

          echo "====== POD DESCRIBE ======"
          kubectl describe pods -n ${NS} -l app=aicave-console | tail -80

          echo "====== POD LOGS (last 50 lines each) ======"
          for pod in $(kubectl get pods -n ${NS} -l app=aicave-console \
            --no-headers -o custom-columns=':metadata.name'); do
            echo "--- Logs: ${pod} ---"
            kubectl logs -n ${NS} ${pod} --tail=50 2>/dev/null || echo "(no logs)"
          done

      # ---------------------------------------------------------------------
      # Verify deployment
      # ---------------------------------------------------------------------
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/aicave-console \
            -n aicave-${{ secrets.DEPLOY_ENV }}
          kubectl get pods -n aicave-${{ secrets.DEPLOY_ENV }} \
            -l app=aicave-console