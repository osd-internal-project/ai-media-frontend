name: CI Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Show package info
      # ---------------------------------------------------------------------
      - name: Show Package Info
        run: |
          name=$(jq -r .name package.json)
          ver=$(jq -r .version package.json)
          echo "📦 Package: $name"
          echo "📦 Version: $ver"

      # ---------------------------------------------------------------------
      # Read package info (for later steps)
      # ---------------------------------------------------------------------
      - name: Read Package Info
        id: pkg
        run: |
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "ver=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Build Docker image
      # ---------------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }} .

      # ---------------------------------------------------------------------
      # Save Docker image as TAR
      # ---------------------------------------------------------------------
      - name: Save Docker Image as TAR
        run: |
          docker save -o \
            ${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.ver }}.tar \
            ${{ steps.pkg.outputs.name }}:${{ steps.pkg.outputs.ver }}

      # ---------------------------------------------------------------------
      # Install OpenVPN
      # ---------------------------------------------------------------------
      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Enable TUN Device
        run: |
          sudo modprobe tun
          sudo chmod 600 /dev/net/tun

      - name: Patch OpenVPN Cipher
        run: |
          echo 'cipher AES-256-CBC' >> .github/workflows/client.ovpn
          echo 'data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:AES-256-CBC' >> .github/workflows/client.ovpn

      # ---------------------------------------------------------------------
      # Connect VPN
      # ---------------------------------------------------------------------
      - name: Connect VPN
        uses: kota65535/github-openvpn-connect-action@v2
        with:
          config_file: .github/workflows/client.ovpn
          username: ${{ secrets.OVPN_USERNAME }}
          password: ${{ secrets.OVPN_PASSWORD }}

      # ---------------------------------------------------------------------
      # Upload image TAR to server
      # ---------------------------------------------------------------------
      - name: Upload via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.ver }}.tar"
          target: "/home/osdadmin/"

      # ---------------------------------------------------------------------
      # Deploy on server
      # ---------------------------------------------------------------------
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            name=${{ steps.pkg.outputs.name }}
            ver=${{ steps.pkg.outputs.ver }}

            cd /home/osdadmin

            docker load -i $name-$ver.tar
            docker rm -f $name || true
            rm -f $name-$ver.tar

            docker run -d \
              --name $name \
              -p 9011:80 \
              --restart always \
              $name:$ver

            echo "Deployment completed: $name:$ver"
