apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aicave-console.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aicave-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aicave-console.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "aicave-console.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: NEXTAUTH_SECRET
          value: "n5yaP7ynm0Qf/JhIJVLXmfQH0zr+YgKwk0TdWo9EFwo="
        - name: VERSION
          value: "2.0.0"
        - name: AUTH_BACKEND_URL
          value: "http://aicave-user-service:8972/api"
        - name: NEXT_PUBLIC_API_BASE_URL_USER
          value: "https://www.aicave.ai/public/api/v1/user/api"
        - name: NEXT_PUBLIC_API_BASE_URL_REPORT
          value: "https://www.aicave.ai/public/api/v1/report"
        - name: NEXT_PUBLIC_API_BASE_URL_CORE
          value: "https://www.aicave.ai/public/api/v1/core"
        - name: NEXT_PUBLIC_API_BASE_URL_WORKER
          value: "https://www.aicave.ai/public/api/v1/worker"
        - name: NEXT_PUBLIC_API_BASE_URL_WEB_HOOCK
          value: "https://www.aicave.ai/public/api/v1/web-hook"
        - name: NEXTAUTH_URL
          value: "https://www.aicave.ai"
        - name: KEYCLOAK_CLIENT_ID
          value: "eportal-client-id"
        - name: KEYCLOAK_CLIENT_SECRET
          value: "kovdYL3AAs9v6e3zxNw4o3CbaBwZiCId"
        - name: KEYCLOAK_ISSUER
          value: "https://id24.aicave.ai/realms/eportal"
        - name: AUTH_TRUST_HOST
          value: "true"
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
