apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: NEXTAUTH_SECRET
          value: {{ .Values.env.nextauthSecret }}
        - name: VERSION
          value: {{ .Values.env.version }}
        - name: AUTH_BACKEND_URL
          value: {{ .Values.env.authBackendUrl }}
        - name: NEXT_PUBLIC_API_BASE_URL_USER
          value: {{ .Values.env.apiBaseUrlUser }}
        - name: NEXT_PUBLIC_API_BASE_URL_REPORT
          value: {{ .Values.env.apiBaseUrlReport }}
        - name: NEXT_PUBLIC_API_BASE_URL_CORE
          value: {{ .Values.env.apiBaseUrlCore }}
        - name: NEXT_PUBLIC_API_BASE_URL_WORKER
          value: {{ .Values.env.apiBaseUrlWorker }}
        - name: NEXT_PUBLIC_API_BASE_URL_WEB_HOOCK
          value: {{ .Values.env.apiBaseUrlWebHook }}
        - name: NEXTAUTH_URL
          value: {{ .Values.env.nextauthUrl }}
        - name: KEYCLOAK_CLIENT_ID
          value: {{ .Values.env.keycloakClientId }}
        - name: KEYCLOAK_CLIENT_SECRET
          value: {{ .Values.env.keycloakClientSecret }}
        - name: KEYCLOAK_ISSUER
          value: {{ .Values.env.keycloakIssuer }}
        - name: AUTH_TRUST_HOST
          value: {{ .Values.env.authTrustHost }}
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory | quote }}
            cpu: {{ .Values.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.resources.limits.memory | quote }}
            cpu: {{ .Values.resources.limits.cpu | quote }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
