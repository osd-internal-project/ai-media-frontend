apiVersion: v1
kind: Service
metadata:
  name: {{ include "aicave-console.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aicave-console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aicave-console.selectorLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
