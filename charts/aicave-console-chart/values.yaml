# Default values for aicave-console
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: aicave-console
namespace: aicave-prod
replicaCount: 5

image:
  repository: docker.io/library/ai-media-fe
  pullPolicy: Always
  tag: "v1.0.37"

imagePullSecretName: huawei-swr-secret

containerPort: 80

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Content-Security-Policy: default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:;";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()"; 
    # จำกัดการส่งข้อมูลออก (Transmit) ของ Pod นี้ไว้ไม่ให้เกิน 50 Mbps
    kubernetes.io/egress-bandwidth: "50M"
        # (เลือกใส่หรือไม่ก็ได้) จำกัดขาเข้า Pod
    kubernetes.io/ingress-bandwidth: "50M"
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  version: "2.0.0"
  authBackendUrl: "http://aicave-user-service:8972/api"
  nextauthUrl: "https://www.aicave.ai"
  nextauthUrlInternal: "http://aicave-console"
  keycloakIssuer: "https://id24.aicave.ai/realms/eportal"
  authTrustHost: "true"
  # Cap V8 old-space below the container memory limit so GC runs before the
  # cgroup OOMKills the Node process. Keep ~2/3 of the limit (this base = 768Mi
  # limit). Per-env overrides scale this to their smaller limits.
  # nodeOptions: "--max-old-space-size=512"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.NEXTAUTH_SECRET
#   secretEnv.KEYCLOAK_CLIENT_ID
#   secretEnv.KEYCLOAK_CLIENT_SECRET

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "768Mi"
    cpu: "500m"

livenessProbe:
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  path: /
  initialDelaySeconds: 10
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Restrict pod egress (DNS + in-namespace + external HTTPS only) to block
# malware download / C2 like the plain-HTTP fetch seen in the incident.
networkPolicy:
  enabled: true
