# Production Environment Values
# Override specific values for PROD environment

namespace: aicave-prod
replicaCount: 5

image:
  tag: "v1.0.37"

ingress:
  hosts:
    - host: www.aicave.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls

env:
  version: "2.0.0"
  authBackendUrl: "http://aicave-user-service:8972/api"
  nextauthUrl: "https://www.aicave.ai"
  nextauthUrlInternal: "http://aicave-console"
  keycloakIssuer: "https://id24.aicave.ai/realms/eportal"
  authTrustHost: "true"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.NEXTAUTH_SECRET
#   secretEnv.KEYCLOAK_CLIENT_ID
#   secretEnv.KEYCLOAK_CLIENT_SECRET

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
