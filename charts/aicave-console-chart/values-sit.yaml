# SIT Environment Values
# Override specific values for SIT environment

namespace: aicave-sit
replicaCount: 2

image:
  tag: "v1.0.25"

ingress:
  hosts:
    - host: sit.aicave.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls-sit

env:
  version: "2.0.0"
  authBackendUrl: "http://aicave-user-service:8972/api"
  nextauthUrl: "https://sit.aicave.ai"
  nextauthUrlInternal: "http://aicave-console"
  keycloakIssuer: "https://id24.aicave.ai/realms/eportal"
  authTrustHost: "true"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.NEXTAUTH_SECRET
#   secretEnv.KEYCLOAK_CLIENT_ID
#   secretEnv.KEYCLOAK_CLIENT_SECRET

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "250m"
