# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave-uat
replicaCount: 3

image:
  tag: "v1.0.25"

ingress:
  hosts:
    - host: uat.aicave.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls-uat

env:
  nextauthSecret: "n5yaP7ynm0Qf/JhIJVLXmfQH0zr+YgKwk0TdWo9EFwo="
  version: "2.0.0"
  authBackendUrl: "http://aicave-user-service:8972/api"
  apiBaseUrlUser: "https://uat.aicave.ai/public/api/v1/user/api"
  apiBaseUrlReport: "https://uat.aicave.ai/public/api/v1/report"
  apiBaseUrlCore: "https://uat.aicave.ai/public/api/v1/core"
  apiBaseUrlWorker: "https://uat.aicave.ai/public/api/v1/worker"
  apiBaseUrlWebHook: "https://uat.aicave.ai/public/api/v1/web-hook"
  nextauthUrl: "https://uat.aicave.ai"
  keycloakClientId: "eportal-client-id"
  keycloakClientSecret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  keycloakIssuer: "https://id24-uat.aicave.ai/realms/eportal"
  authTrustHost: "true"

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "192Mi"
    cpu: "350m"
