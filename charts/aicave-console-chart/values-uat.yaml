# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave-uat
replicaCount: 3

image:
  tag: "v1.0.25"

ingress:
  hosts:
    - host: uat.aicave.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-console-tls-uat

env:
  version: "2.0.0"
  authBackendUrl: "http://aicave-user-service:8972/api"
  nextauthUrl: "https://uat.aicave.ai"
  nextauthUrlInternal: "http://aicave-console"
  keycloakIssuer: "https://id24-uat.aicave.ai/realms/eportal"
  authTrustHost: "true"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.NEXTAUTH_SECRET
#   secretEnv.KEYCLOAK_CLIENT_ID
#   secretEnv.KEYCLOAK_CLIENT_SECRET

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "192Mi"
    cpu: "350m"
