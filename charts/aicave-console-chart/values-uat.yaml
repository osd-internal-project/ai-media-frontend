# UAT Environment Values
# Override specific values for UAT environment

namespace: aicave
replicaCount: 1

image:
  tag: "v1.0.25"

ingress:
  hosts:
    - host: aicave-uat.osd.co.th
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: aicave-tls

env:
  version: "2.0.0"
  authBackendUrl: "http://aicave-user-service:8972/api"
  nextauthUrl: "https://aicave-uat.osd.co.th"
  nextauthUrlInternal: "http://aicave-console"
  keycloakIssuer: "https://auth-events.osd.co.th/realms/eportal"
  authTrustHost: "true"

# Secrets managed via GitHub Actions secrets and passed with --set:
#   secretEnv.NEXTAUTH_SECRET
#   secretEnv.KEYCLOAK_CLIENT_ID
#   secretEnv.KEYCLOAK_CLIENT_SECRET

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "192Mi"
    cpu: "350m"
